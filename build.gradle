buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath 'net.fabricmc:fabric-loom:1.14-SNAPSHOT' }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

def mcVersion     = '26.2'
def loaderVersion = '0.17.0'

version = '1.0.0'
group = 'dev.venice'
base { archivesName = 'multiaccount' }

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"

    compileOnly "net.java.dev.jna:jna-platform:5.14.0"
    // include "net.java.dev.jna:jna-platform:5.14.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
